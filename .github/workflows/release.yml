name: Release

# Publishes a release when the top CHANGELOG.md version has no tag yet.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the latest CHANGELOG version
        id: version
        run: |
          tag=$(grep -m1 -oE '^## \[v[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE 'v[0-9.]+' || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        if: steps.version.outputs.new == 'true'
        run: |
          awk -v tag="${{ steps.version.outputs.tag }}" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: true
